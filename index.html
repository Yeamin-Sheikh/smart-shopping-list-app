<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Cart App | Mobile Grocery & Shopping List Tracker</title>
  <meta name="description" content="Mobile-first shopping list and pantry tracker. Smart categories, live budget calculations, recipe ingredient import, and offline storage.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!-- Top Navigation & Viewport Mode -->
  <nav class="top-nav">
    <div class="top-nav-inner">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <img src="assets/svgs/logo.svg" alt="Smart Cart App" height="38">
      </div>
      <div>
        <button id="frame-toggle-btn" class="mode-toggle-btn">
          <span>🖥️ Switch to Fullscreen</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Stage -->
  <main id="app-stage" class="app-stage">
    <div class="mobile-frame">
      <!-- Dynamic Island for Mobile Simulator -->
      <div class="dynamic-island">
        <div class="camera-lens"></div>
      </div>

      <!-- App Header -->
      <div class="app-header">
        <div class="app-title-row">
          <select id="list-selector" class="list-selector">
            <option value="weekly-groceries">Weekly Groceries</option>
            <option value="party-supplies">Weekend BBQ & Party</option>
          </select>
          <div id="budget-pill" class="budget-pill">$34.63 / $75.00</div>
        </div>

        <!-- Hero Card Showcase -->
        <div class="app-hero-card" style="background-image: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.75)), url('assets/images/hero.jpg');">
          <div class="hero-card-content">
            <span class="hero-tag">Smart Pantry & Kitchen</span>
            <h3 class="hero-title">Organize meals & track grocery spending</h3>
            <button id="open-recipes-modal-btn" class="hero-recipe-btn">
              <span>🥑 View Recipe Inspiration</span>
            </button>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-text">
            <span>SHOPPING PROGRESS</span>
            <span id="progress-ratio">2 of 6 done (33%)</span>
          </div>
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill" style="width: 33%;"></div>
          </div>
        </div>
      </div>

      <!-- Category Filter Pills -->
      <div id="category-scroller" class="category-scroller"></div>

      <!-- Recipe Importer Bar -->
      <div style="padding: 0 1.5rem; margin-top: 0.75rem;">
        <div class="recipe-import-bar">
          <span style="font-weight: 700;">Import Recipe:</span>
          <select id="recipe-select" class="recipe-select"></select>
          <button id="import-recipe-btn" class="btn" style="padding: 0.25rem 0.6rem; font-size: 0.75rem; background: #059669; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">+ Add</button>
        </div>
      </div>

      <!-- Grocery Items List -->
      <div id="items-list" class="items-list-container"></div>

      <!-- Quick Add Footer Bar -->
      <div class="app-footer">
        <form id="quick-add-form" class="quick-add-form">
          <input type="text" id="quick-add-input" class="quick-add-input" placeholder="Add item (e.g. Avocado, Sourdough, Eggs)..." required>
          <button type="submit" class="add-btn">Add</button>
        </form>
      </div>
    </div>
  </main>

  <!-- Recipe Inspiration Modal -->
  <div id="recipe-modal-overlay" class="modal-overlay"></div>
  <div id="recipe-modal" class="modal-box">
    <button class="modal-close" id="recipe-modal-close" aria-label="Close modal">&times;</button>
    <h3 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 0.35rem; color: var(--text-main);">Chef-Curated Recipe Bundles</h3>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem;">
      Add all fresh ingredients directly to your grocery cart with one click.
    </p>

    <div class="recipe-cards-grid" id="recipe-cards-container"></div>
  </div>

  <!-- Custom Right-Click Context Menu -->
  <div id="custom-context-menu" class="custom-context-menu" role="menu">
    <div class="context-menu-item" data-action="cut">
      <span>Cut</span>
      <span style="font-size: 0.75rem; color: var(--text-muted);">Ctrl+X</span>
    </div>
    <div class="context-menu-item" data-action="copy">
      <span>Copy</span>
      <span style="font-size: 0.75rem; color: var(--text-muted);">Ctrl+C</span>
    </div>
    <div class="context-menu-item" data-action="paste">
      <span>Paste</span>
      <span style="font-size: 0.75rem; color: var(--text-muted);">Ctrl+V</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" data-action="selectall">
      <span>Select All</span>
      <span style="font-size: 0.75rem; color: var(--text-muted);">Ctrl+A</span>
    </div>
  </div>

  <div style="display: none;">
    <object id="svg-sprite-holder" data="assets/svgs/icons.svg" type="image/svg+xml"></object>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
